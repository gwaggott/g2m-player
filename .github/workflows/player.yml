# Builds and tests on Linux, Windows and macOS, and packages a zip per OS
# (packaging/package.cmake) as a build artifact.
name: player

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            shell: bash
            configure: ''
          - name: windows-x64
            os: windows-2022
            shell: pwsh  # Git Bash's /usr/bin/link would hide MSVC's linker
            configure: -G Ninja
          - name: macos-universal
            os: macos-15
            shell: bash
            configure: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libdbus-1-dev libjack-jackd2-dev liblilv-dev lv2-dev

      # vcvars64.bat's environment, for the later steps (instead of
      # ilammy/msvc-dev-cmd, which still runs on Node.js 20)
      - name: MSVC environment
        if: runner.os == 'Windows'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }} 2>&1 | Tee-Object -FilePath configure.log
          exit $LASTEXITCODE

      # Configure, build and test output also go to logs, whose errors the last step
      # repeats as annotations (which anyone can read; the logs need a login)
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE

      # The package bundles the shareable model (MODELS.md) in a build of its
      # own: a build with bundled models runs only the bundled-model tests.
      - name: Configure the package
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }} -DG2M_BUNDLED_MODELS=models/v1-0-alpha.g2m -DG2M_PACKAGE_SHAREABLE=ON

      - name: Build the package
        run: cmake --build build/release --parallel

      - name: Test the package
        run: ctest --test-dir build/release --output-on-failure

      - name: Package
        run: cmake --build build/release --target g2m-package

      - uses: actions/upload-artifact@v7
        with:
          name: g2m-player-${{ matrix.name }}
          path: build/release/package/*.zip
          if-no-files-found: error

      - name: Errors as annotations
        if: failure()
        shell: pwsh
        run: |
          $lines = foreach ($log in 'configure.log', 'build.log', 'test.log') {
            if (Test-Path $log) { Select-String -Path $log -Pattern 'error|FAILED|Failed|undefined|Could NOT|not found' | ForEach-Object { "$log`: $($_.Line)" } }
          }
          $lines = @($lines | Select-Object -First 60)
          for ($i = 0; $i -lt $lines.Count; $i += 15) {
            "::error title=$($i / 15 + 1)::" + (($lines[$i..([Math]::Min($i + 14, $lines.Count - 1))]) -join '%0A')
          }
